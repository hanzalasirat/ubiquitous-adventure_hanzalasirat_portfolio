name: Verify premium portfolio
on:
  pull_request:
    branches: [main]
  push:
    branches: ['rebuild/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: https://example.test/contact
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-portfolio-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
